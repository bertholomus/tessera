[package]
name = "tessera-linear"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated matmul kernels, registered as lowering rules"

[features]
default = []
cuda = ["tessera-run/cuda"]
rocm = ["tessera-run/rocm"]

[dependencies]
tessera-codegen = { workspace = true }
tessera-graph = { workspace = true }
tessera-kernels = { workspace = true }
tessera-lower = { workspace = true }
tessera-mem = { workspace = true }

[dev-dependencies]
tessera-testkit = { workspace = true }
tessera-interp = { workspace = true }
tessera-gpukit = { workspace = true }
tessera-run = { workspace = true }
tessera-trace = { workspace = true }
